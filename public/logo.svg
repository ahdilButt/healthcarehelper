  <rect x="0" y="0" width="96" height="96" rx="27" fill="#C05A3E"/>
  <g fill="#F7EDE2">
    <rect x="22" y="20" width="13" height="56" rx="6.5"/>
    <rect x="61" y="20" width="13" height="56" rx="6.5"/>
  </g>
  <g fill="#4A2B21">
    <rect x="33" y="27" width="11" height="46" rx="5.5"/>
    <rect x="52" y="27" width="11" height="46" rx="5.5"/>
    <rect x="33" y="44" width="30" height="11" rx="5.5"/>
  </g>
  <!-- Wordmark -->
  <text x="118" y="63" textLength="350" lengthAdjust="spacingAndGlyphs"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1.2">
